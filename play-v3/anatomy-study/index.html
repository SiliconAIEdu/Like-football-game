<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C罗 · 肩胸动作检查</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101c23;color:#f4f1e8;font:16px system-ui}main{max-width:1250px;margin:auto;padding:25px}h1{font-size:30px}p{color:#b9cbd1;line-height:1.6}a{color:#f3b7a5}#stage{height:65vh;min-height:400px;background:#34434c;border-radius:16px;overflow:hidden;touch-action:none}canvas{display:block}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button{background:#263840;color:#fff;border:1px solid #60717a;border-radius:9px;padding:11px 15px;font:inherit;cursor:pointer}button.active{background:#efb6a5;color:#1c252b}#status{min-height:25px}header{display:flex;align-items:center;justify-content:space-between;gap:15px}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script>
<main><header><h1>C罗 · 肩胸动作检查</h1><a href="../../">回到游戏 →</a></header><p>拖动人物查看侧面和背面，滚轮缩放。这里加载的是游戏中的同一个新版模型。</p><div id="stage"></div><nav id="poses"><button data-clip="CheckRest" class="active">自然垂臂</button><button data-clip="CheckSide45">侧抬 45°</button><button data-clip="CheckSide90">侧平举</button><button data-clip="CheckForward90">向前伸手</button><button data-clip="CheckOverhead">侧向举过头</button><button data-clip="CheckForwardHigh">向前举过头</button><button data-clip="CheckDiagonal">斜向高举</button><button data-clip="ReactGoal">庆祝动作</button><button data-clip="Kick">射门动作</button></nav><nav><button id="front">正面</button><button id="side">侧面</button><button id="back">背面</button><button id="wire">显示网格</button></nav><p id="status">正在加载模型…</p></main>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from '../vendor/loaders/GLTFLoader.js';import {updateUpperArmVolume} from '../shoulder-deformation.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),scene=new THREE.Scene();scene.background=new THREE.Color('#34434c');
const camera=new THREE.PerspectiveCamera(42,1,.01,50);let distance=2.1;const aim=new THREE.Vector3(0,1.35,0);function view(){camera.position.set(0,1.45,distance);camera.lookAt(aim)}view();
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;stage.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x647079,2));for(const [x,y,z,power] of [[-3,4,4,2],[3,2,3,1.2],[0,3,-3,1.3]]){const l=new THREE.DirectionalLight(0xffffff,power);l.position.set(x,y,z);scene.add(l)}
const pivot=new THREE.Group();scene.add(pivot);let model,mixer,clips,current;
function select(name){if(!mixer)return;distance=/Overhead|ForwardHigh/.test(name)?2.8:2.1;aim.y=/Overhead|ForwardHigh/.test(name)?1.55:1.4;view();const clip=clips.find(c=>c.name===name);if(!clip){status.textContent='动作未找到：'+name;return}mixer.stopAllAction();current=mixer.clipAction(clip);current.reset().play();mixer.update(0);updateUpperArmVolume(model);document.querySelectorAll('[data-clip]').forEach(b=>b.classList.toggle('active',b.dataset.clip===name));status.textContent='当前：'+document.querySelector('[data-clip="'+name+'"]').textContent+' · 可拖动旋转检查';}
new GLTFLoader().load('../assets/ronaldo-anatomy-v8.glb',g=>{model=g.scene;clips=g.animations;pivot.add(model);mixer=new THREE.AnimationMixer(model);select('CheckRest')},undefined,e=>{status.textContent='模型加载失败：'+e.message;console.error(e)});
document.querySelector('#poses').onclick=e=>{if(e.target.dataset.clip)select(e.target.dataset.clip)};document.querySelector('#front').onclick=()=>pivot.rotation.y=0;document.querySelector('#side').onclick=()=>pivot.rotation.y=Math.PI/2;document.querySelector('#back').onclick=()=>pivot.rotation.y=Math.PI;document.querySelector('#wire').onclick=()=>model?.traverse(o=>{if(o.isMesh)o.material.wireframe=!o.material.wireframe});
let drag=null;stage.onpointerdown=e=>{drag=e.clientX;stage.setPointerCapture(e.pointerId)};stage.onpointermove=e=>{if(drag!==null){pivot.rotation.y+=(e.clientX-drag)*.008;drag=e.clientX}};stage.onpointerup=stage.onpointercancel=()=>drag=null;stage.onwheel=e=>{e.preventDefault();distance=Math.max(1.6,Math.min(4.5,distance+e.deltaY*.002));view()};
new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}).observe(stage);
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(mixer){mixer.update(dt);updateUpperArmVolume(model)}renderer.render(scene,camera)}loop();
</script></html>
