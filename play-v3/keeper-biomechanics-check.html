<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>全员扑救动作 · 人体力学修订</title><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script><style>body{margin:0;background:#17232e;color:#fff;font:16px system-ui}header{padding:14px 20px;height:150px;box-sizing:border-box}h2{margin:0 0 10px}select,button,input{margin:4px;padding:6px}#status{font-size:13px;color:#bcd2df}canvas{display:block}</style><header><h2>全员扑救动作</h2><select id="player" aria-label="球员"></select><select id="direction" aria-label="方向"><option value="Dive">向左</option><option value="DiveMirror">向右</option></select><select id="height" aria-label="球高"><option value="mid">中球</option><option value="low">低球</option><option value="high">高球</option></select><button id="play">播放 / 暂停</button><button id="side">正面 / 侧面</button><input id="phase" aria-label="动作进度" type="range" min="0" max="1" step="0.001" value="0"><div id="status">加载中</div></header><script type="module">
import * as T from 'three';import{GLTFLoader}from'./vendor/loaders/GLTFLoader.js';import{players}from'./roster.js';import{biomechanicalKeeperClips,diveEnvelope,beginDivePlant,applyDivePlant}from'./keeper-biomechanics.js';import{resetKeeperGround,keepKeeperAboveGround}from'./keeper-ground.js';import{updateUpperArmVolume}from'./shoulder-deformation.js';
const $=id=>document.getElementById(id),options=[players.find(p=>p.id==='haaland'),...players.filter(p=>p.id!=='haaland')];for(const p of options)$('player').add(new Option(p.name,p.id));
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color(0x17232e);scene.add(new T.HemisphereLight(0xffffff,0x6b7080,2));for(const pos of [[-3,5,4],[3,3,-2]]){const l=new T.DirectionalLight(0xffffff,2.5);l.position.set(...pos);scene.add(l)}const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:0x284333,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);scene.add(new T.GridHelper(14,28,0x558866,0x365b42));const camera=new T.PerspectiveCamera(38,1,.01,100);let actor,mixer,action,clips,phase=0,playing=false,side=false,serial=0;const clock=new T.Clock();
function resize(){renderer.setSize(innerWidth,innerHeight-150);camera.aspect=innerWidth/(innerHeight-150);camera.updateProjectionMatrix()}onresize=resize;resize();
function select(){mixer.stopAllAction();action=mixer.clipAction(clips.find(c=>c.name===$('direction').value));action.setLoop(T.LoopOnce,1);action.clampWhenFinished=true;action.reset().play();phase=0;actor.root.position.set(0,0,0);resetKeeperGround(actor);mixer.setTime(0);beginDivePlant(actor,$('direction').value==='Dive'?-1:1);renderPose()}
async function load(){const token=++serial;$('status').textContent='加载中…';const p=options.find(p=>p.id===$('player').value),g=await new GLTFLoader().loadAsync(p.model);if(token!==serial)return;if(actor)scene.remove(actor.root);clips=biomechanicalKeeperClips(g.scene);const bounds=new T.Box3().setFromObject(g.scene),scale=p.height/(bounds.max.y-bounds.min.y);g.scene.scale.multiplyScalar(scale);g.scene.position.y=-bounds.min.y*scale;const root=new T.Group();root.add(g.scene);scene.add(root);actor={root,model:g.scene,height:p.height,tracksIncomingBall:true};mixer=new T.AnimationMixer(g.scene);select();$('status').textContent=p.name+' · 蓄力 → 蹬地 → 伸手 → 侧身落地 → 恢复'}
function renderPose(){if(!actor)return;resetKeeperGround(actor);mixer.setTime(phase*action.getClip().duration);const e=diveEnvelope(phase),sign=$('direction').value==='Dive'?-1:1,lift={low:.06,mid:.43,high:1.02}[$('height').value];actor.root.position.set(sign*2.35*e.travel,lift*e.flight,0);actor.root.updateMatrixWorld(true);applyDivePlant(actor,phase);updateUpperArmVolume(actor.model);keepKeeperAboveGround(actor);const center=sign*1.15*e.travel;camera.position.set(center+(side?6:0),2.6,side?1:6);camera.lookAt(center,.75,0);$('phase').value=phase;}
$('player').onchange=()=>load().catch(e=>$('status').textContent=e.message);$('direction').onchange=select;$('height').onchange=renderPose;$('play').onclick=()=>playing=!playing;$('side').onclick=()=>{side=!side;renderPose()};$('phase').oninput=e=>{playing=false;phase=Number(e.target.value);renderPose()};renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(playing&&actor){phase=(phase+dt/1.6)%1;renderPose()}renderer.render(scene,camera)});load().catch(e=>$('status').textContent=e.message);
</script></html>
