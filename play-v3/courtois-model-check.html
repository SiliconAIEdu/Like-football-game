<!doctype html><html lang="zh"><meta charset="utf-8"><title>库尔图瓦 · 模型与动作检查</title><style>body{margin:0;background:#222832;color:white;font:15px system-ui}header{position:absolute;padding:16px;background:#222832dd;border-radius:0 0 16px 0;z-index:1}select,button{font:inherit;padding:7px;margin:4px}p{margin:8px 0;color:#d2d5df}canvas{display:block}</style><header><b>库尔图瓦 · 紫色 1 号门将</b><p>拖动旋转 · 滚轮缩放</p><select id="clip"><option>加载中…</option></select><button id="mid">定格中段</button><button id="front">正面</button><button id="back">背面</button><button id="side">侧面</button><button id="face">头颈</button><p id="status">加载模型…</p></header><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script><script type="module">
import * as T from 'three';import{GLTFLoader}from './vendor/loaders/GLTFLoader.js';import{yamalKeeperClips}from './keeper-retarget.js';
const scene=new T.Scene();scene.background=new T.Color('#444a55');const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x6a6270,2));for(const [x,y,z,k]of [[-3,4,5,3],[3,2,-3,2]]){let l=new T.DirectionalLight(0xffffff,k);l.position.set(x,y,z);scene.add(l)}
let yaw=0,pitch=.03,dist=4.2,look=1,down=false,px,py;const clock=new T.Clock();let mixer,paused=false;const select=document.querySelector('#clip');
const loader=new GLTFLoader();Promise.all([loader.loadAsync('assets/courtois-game-v1.glb'),loader.loadAsync('assets/yamal-playable-v1.glb')]).then(([g,ref])=>{scene.add(g.scene);mixer=new T.AnimationMixer(g.scene);const clips=g.animations;select.innerHTML='<option value="rest">静态外观</option>';for(const clip of clips){const o=document.createElement('option');o.value=clip.name;o.textContent=clip.name;select.append(o)}document.querySelector('#mid').onclick=()=>{if(select.value!=='rest'){const clip=clips.find(c=>c.name===select.value);mixer.setTime(clip.duration*.5);paused=true}};select.onchange=()=>{paused=false;mixer.stopAllAction();if(select.value!=='rest')mixer.clipAction(clips.find(c=>c.name===select.value)).play()};document.querySelector('#status').textContent='模型已加载 · 可检查静态与左右扑救';}).catch(e=>document.querySelector('#status').textContent=e.message);
for(const [id,y]of [['front',0],['back',Math.PI],['side',Math.PI/2]])document.querySelector('#'+id).onclick=()=>{yaw=y;look=1;dist=4.2};document.querySelector('#face').onclick=()=>{yaw=0;look=1.81;dist=1.1};
renderer.domElement.onpointerdown=e=>{down=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>down=false;renderer.domElement.onpointermove=e=>{if(down){yaw-=(e.clientX-px)*.008;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-py)*.006));px=e.clientX;py=e.clientY}};renderer.domElement.onwheel=e=>{e.preventDefault();dist=Math.max(.6,Math.min(7,dist*Math.exp(e.deltaY*.001)))};onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(!paused)mixer?.update(Math.min(dt,.05));camera.position.set(Math.sin(yaw)*dist*Math.cos(pitch),look+Math.sin(pitch)*dist,Math.cos(yaw)*dist*Math.cos(pitch));camera.lookAt(0,look,0);renderer.render(scene,camera)});
</script></html>
